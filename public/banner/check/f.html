<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
:root{--ink:#17201e;--sub:#4a4f4e;--band:#f5a000;--band-t:#c26a00;--green:#15913f;--green-d:#0e6e2f;--ok:#15913f;--ng:#d9302f;--line:#d9dedd;--teal:#0f7a74;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"M PLUS Rounded 1c","HG丸ｺﾞｼｯｸM-PRO","HGMaruGothicMPRO","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
[lang="ja"] :is(h1,p,span,button,td){word-break:auto-phrase}
/* 黄色の帯（バナーの一番上の帯と同じ形） */
.band{position:sticky;top:0;z-index:5;background:var(--band);display:flex;align-items:center;gap:9px;padding:9px 14px;height:46px}
.band .lb{background:#fff;color:var(--band-t);font-weight:800;font-size:15px;border-radius:6px;padding:1px 8px;white-space:nowrap;line-height:1.5}
.band b{color:#fff;font-size:18px;font-weight:800;white-space:nowrap;flex:1}
.band .pos{color:#fff;font-size:16px;font-weight:800;white-space:nowrap}
main{padding:14px 16px 112px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:23px;font-weight:800;line-height:1.4;text-align:center}
.big{margin:0;text-align:center;font-weight:900;font-size:30px;line-height:1.3}
.big.num{font-size:58px;letter-spacing:.06em;line-height:1.1}
.big.ok{color:var(--ok)}
.one{margin:0;text-align:center;font-weight:800;font-size:19px;line-height:1.5}
.why{margin:0;font-size:17px;line-height:1.6;color:var(--sub);font-weight:700}
.scene{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene div{border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.scene svg{width:46px;height:46px;flex:none}
.scene span{font-size:16px;font-weight:800;line-height:1.35}
/* 下に固定した緑のボタン（バナーの「答えを見る」と同じ緑と形） */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;padding:10px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.go{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:58px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--green-d);cursor:pointer;line-height:1.3;padding:6px 10px}
.go{text-decoration:none}
.go small{font-size:14px;font-weight:700}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.go:focus-visible,.opt:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
/* 問題の画面：絵と 4 択が画面の高さに入るように、絵の方を縮める */
body.q main{height:calc(100vh - 46px);height:calc(100dvh - 46px);padding-bottom:14px}
.figbox{flex:1 1 auto;min-height:120px;display:flex;justify-content:center}
.figbox canvas{width:100%;height:100%;object-fit:contain;display:block}
.timer{display:flex;align-items:center;gap:10px}
.timer .tb{flex:1;height:12px;background:#f1dcdc;border-radius:999px;overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%;background:var(--ng);border-radius:999px;transition:width 1s linear}
.timer b{font-size:18px;color:var(--ng);white-space:nowrap;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.opt{font:inherit;font-weight:800;font-size:22px;min-height:56px;border-radius:12px;border:2px solid #c3c9c8;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c3c9c8;cursor:pointer;white-space:nowrap}
.opt:active{transform:translateY(2px);box-shadow:none}
/* 1問目の答えの絵：バナーの絵と同じ大きさ（バナーの幅＝min(86vw, 80vh×9/16)） */
.ansfig{position:relative;width:min(86vw,calc(80vh * 9 / 16));margin:0 auto;border-radius:10px;overflow:hidden}
.ansfig img{display:block;width:100%;height:auto}
.ansfig svg{position:absolute;inset:0;width:100%;height:100%}
.ans2fig{display:flex;justify-content:center}
.ans2fig canvas{width:100%;max-height:230px;object-fit:contain;display:block}
/* 結果 */
.tbl{width:100%;border-collapse:collapse;font-size:18px}
.tbl td{border-bottom:1px solid var(--line);padding:10px 6px;font-weight:800}
.tbl td.m{width:3.2em;text-align:center;font-size:28px;line-height:1}
.tbl td.m.o{color:var(--ok)}.tbl td.m.x{color:var(--ng)}
.rec{background:#fff4dc;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rec .hd{display:flex;align-items:center;gap:10px}
.rec .hd img{width:62px;flex:none}
.rec .hd p{margin:0;font-weight:800;font-size:20px;line-height:1.4;color:var(--ink)}
.rec .app{margin:0;font-weight:800;font-size:18px}
.rec .txt{margin:0;font-size:16px;line-height:1.6;font-weight:700;color:var(--sub)}
.rec .shot{width:62%;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:750 / 700}
.rec .shot img{display:block;width:100%;height:auto}
/* 4問目（見るだけ）：模様が 2 つずつ消えていく動き（rule.gif の文字の帯を切った物） */
.wfig{width:min(100%,330px);margin:0 auto;border-radius:12px;overflow:hidden;background:#f7f8fb}
.wfig img{display:block;width:100%;height:auto}
/* 006: 1問目の 2 つのボタン・3問目の答えの絵・結果の一言・帯・注記・見るだけのラベル */
.foot.two{display:flex;gap:10px}
.foot.two .go{flex:1;font-size:20px}
.ans3fig{display:flex;justify-content:center}
.ans3fig canvas{width:100%;max-height:250px;object-fit:contain;display:block}
.tbl td.c{font-size:15px;font-weight:700;color:var(--sub);padding-left:4px}
.care{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 0;padding:0 0 8px;border-bottom:4px solid var(--band)}
.care svg{width:40px;height:40px;flex:none}
.care p{margin:0;font-size:22px;font-weight:900;line-height:1.35;text-align:center}
.fine{margin:4px 0 0;font-size:12px;color:var(--sub);text-align:center;line-height:1.5}
.privacy{margin:14px 0 calc(96px + env(safe-area-inset-bottom));text-align:center;font-size:12px;line-height:1.5}.privacy a{color:var(--sub)}
.okl{align-self:center;margin:-4px 0 0;background:#fff4dc;color:var(--band-t);border:1.5px solid var(--band);border-radius:999px;font-size:14px;font-weight:800;padding:1px 12px;line-height:1.5}
.wfig{width:min(100%,330px,calc((100vh - 330px) * 492 / 442));width:min(100%,330px,calc((100dvh - 330px) * 492 / 442))}
/* 008: 答えの画面（1〜3問目）と結果を詰めて、「今の私のこと」をボタンの上に見せる。入りきらない画面は、ボタンのすぐ上に下へ続く影 */
body.a main{padding-top:10px;gap:8px}
body.a .ansfig{width:calc(min(86vw,calc(80vh * 9 / 16)) * .8)}
body.a .ans2fig canvas{max-height:205px}
body.a .ans3fig canvas{max-height:200px}
.ask{margin:0;font-size:17px;font-weight:800;line-height:1.4;text-align:center}
.scene div{flex-direction:row;justify-content:center;gap:4px;padding:5px 4px;text-align:left}
.scene svg{width:38px;height:38px}
body.a .tbl td{padding:4px 6px}
body.a .tbl td:not(.m){line-height:1.35}
body.a .care{margin:0}
/* 013: 結果の前の一文は表の説明として表に寄せ、コンセプトの帯は上下に線を引いて前後から切り離す */
.tbl + .one{margin-top:-4px;font-size:17px;font-weight:700;color:var(--sub)}
.tbl + .one + .care{margin-top:12px;padding:10px 0;border-top:4px solid var(--band)}
.care p{letter-spacing:.04em}
/* 020: 結果画面のミエトレ見学（.rec と .fine の間）。見出しは 5 つの文を同じ所で順に出し、止まらず繰り返す（1 文 約3.5秒、1 回 17.5秒。021）。4問目用の .wh span:nth-child の動きより強く当てるため .dw を前に付ける */
.dw{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.dw .dwl{align-self:flex-start;font-size:13px;font-weight:800;color:var(--sub);line-height:1.4}
.dw .wh{margin:0;font-size:18px;font-weight:800;line-height:1.45;text-align:center}
.dw .wh.loop span{animation:whLoop 17.5s linear infinite both}
.dw .wh.loop span:nth-child(2){animation-delay:3.5s}
.dw .wh.loop span:nth-child(3){animation-delay:7s}
.dw .wh.loop span:nth-child(4){animation-delay:10.5s}
.dw .wh.loop span:nth-child(5){animation-delay:14s}
@keyframes whLoop{0%{opacity:0}2.4%{opacity:1}18%{opacity:1}20%{opacity:0}100%{opacity:0}}
.dw .okl{margin:0}
.dw .wfig{width:min(100%,280px)}
.wl{margin:-4px 0 0;text-align:center;font-size:17px;font-weight:700;line-height:1.5;color:var(--sub)}
@media (prefers-reduced-motion:reduce){.dw .wh.loop span:nth-child(1){display:block}}
.fade{position:fixed;left:0;right:0;height:24px;z-index:6;pointer-events:none;background:linear-gradient(rgba(255,255,255,0),#fff);display:none}
/* 010: 4問目（見るだけ）の見出し。3 つの文を同じ所に重ね、順に出す（1・2 は約 3.5 秒で消え、3 は残る）。高さは一番高い文に合わせて固定。動きを減らす設定では 2 と 3 を縦に並べる（011）（3 つ並べると模様がボタンに隠れるため）。見出しが高くなる分、模様の絵を小さくする */
.wh{display:grid}
.wh span{grid-area:1/1;opacity:0}
.wh span:nth-child(1){animation:whOut .4s ease 3.5s both}
.wh span:nth-child(2){animation:whIn .4s ease 3.9s both,whOut .4s ease 7.8s forwards}
.wh span:nth-child(3){animation:whIn .4s ease 8.2s both}
@keyframes whIn{from{opacity:0}to{opacity:1}}
@keyframes whOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.wh{display:flex;flex-direction:column;gap:4px}
 .wh span{animation:none!important;opacity:1}
 .wh span:nth-child(1){display:none}
 .wfig{width:min(100%,330px,calc((100vh - 400px) * 492 / 442));width:min(100%,330px,calc((100dvh - 400px) * 492 / 442))}}
/* ===== 2026-10-29 F・G 見本で足した所 ===== */
/* 上の進み具合（帯のすぐ下に固定） */
.prog{margin:0;position:sticky;top:46px;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px;height:50px}
.prog li{list-style:none;flex:1 1 0;max-width:92px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:800;color:#9aa3a1;line-height:1.2;white-space:nowrap;position:relative;text-align:center}
.prog li:has(br){font-size:10px;line-height:1.05}
.prog li::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c3c9c8;background:#fff;box-sizing:border-box}
.prog li.now{color:var(--band-t)}
.prog li.now::before{border-color:var(--band);background:var(--band);box-shadow:0 0 0 3px #ffe7b3}
.prog li.done{color:var(--ok)}
.prog li.done::before{content:"✓";border-color:var(--ok);background:var(--ok);color:#fff;font-size:13px;line-height:16px;text-align:center}
.prog li.pop::before{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
body.q main{height:calc(100vh - 96px);height:calc(100dvh - 96px)}
.later{align-self:center;margin:0;background:#fff4dc;color:var(--band-t);border:1.5px solid var(--band);border-radius:999px;font-size:14px;font-weight:800;padding:1px 12px;line-height:1.6;flex:none}
/* 帯の名前のアイコン（見えるかなゲーム） */
.band b{display:flex;align-items:center;gap:6px}
.band .gi{width:26px;height:26px;flex:none;object-fit:contain}
/* 結果：最初の数字の答え */
.q1box{border:2px solid var(--band);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.q1box .ttl{margin:0;font-size:15px;font-weight:800;color:var(--band-t)}
.q1pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.q1pair figure{margin:0;text-align:center}
.q1pair img{display:block;width:100%;border-radius:8px}
.q1pair figcaption{font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
.q1pair .ar{font-size:22px;font-weight:900;color:var(--band)}
.digits{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.digits b{display:block;font-size:44px;font-weight:900;line-height:1.05;letter-spacing:0}
.digits small{display:block;font-size:12px;font-weight:800;color:var(--sub);line-height:1.3}
.digits .l1 b{color:#17201e}.digits .l2 b{color:#3d4544}.digits .l3 b{color:#6f7876}.digits .l4 b{color:#a4abaa}
.q1box .one{font-size:16px}
/* 結果：2・3問目の折りたたみ */
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 4px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc .nm{font-weight:800;font-size:17px;line-height:1.3}
.acc .nm small{display:block;font-size:13px;font-weight:700;color:var(--sub)}
.acc .nm em{display:block;font-style:normal;font-size:14px;font-weight:800;line-height:1.35;color:var(--band-t)}
.acc .nm em.o{color:var(--ok)}
.acc .mk{font-size:28px;font-weight:900;line-height:1}
.acc .mk.o{color:var(--ok)}.acc .mk.x{color:var(--ng)}
.acc .op{font-size:12px;font-weight:800;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:0 8px;white-space:nowrap}
.acc details[open] .op{background:var(--teal);color:#fff}
.acc .body{padding:0 0 10px}
.acc .body canvas{width:100%;max-height:220px;object-fit:contain;display:block}
.acc .body p{margin:4px 0 0;text-align:center;font-weight:800;font-size:15px}
.res1{margin:0;font-size:16px;font-weight:700;color:var(--sub);text-align:center}
/* G：結果の振り返り（E と同じ） */
.ew{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ew .ewh{display:flex;align-items:center;gap:10px}
.ew .ewh img{width:38%;max-width:140px;flex:none;border-radius:10px;background:#f7f8fb;display:block;height:auto}
.ew .ewh p{margin:0;font-size:17px;font-weight:800;line-height:1.45}
.ew .ewr{margin:0;text-align:center;font-size:17px;font-weight:800;line-height:1.5;color:var(--band-t)}
/* G：見学の画面（5 文を順に出す。E と同じ） */
.wt{margin:0;align-self:center;font-size:15px;font-weight:800;color:var(--band-t)}
.wh5{display:grid;margin:0;font-size:21px;font-weight:800;line-height:1.4;text-align:center}
.wh5 span{grid-area:1/1;opacity:0}
.wh5 span:nth-child(1){animation:whO .4s ease 3.5s both}
.wh5 span:nth-child(2){animation:whI .4s ease 3.9s both,whO .4s ease 7.8s forwards}
.wh5 span:nth-child(3){animation:whI .4s ease 8.2s both,whO .4s ease 12.1s forwards}
.wh5 span:nth-child(4){animation:whI .4s ease 12.5s both,whO .4s ease 16.4s forwards}
.wh5 span:nth-child(5){animation:whI .4s ease 16.8s both}
@keyframes whI{from{opacity:0}to{opacity:1}}
@keyframes whO{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.wh5 span{animation:none!important;opacity:1}.wh5 span:not(:nth-child(5)){display:none}.prog li.pop::before{animation:none}}

/* 2026-10-29 005: 縦の短い画面（SE3 など）だけ、進み具合を細く・札を小さく・選択肢を 1 段にして、絵を D・E と同じくらいに */
@media (max-height:640px){
 .prog{height:36px;padding:3px 8px}
 .prog li{font-size:10px;line-height:1.1;flex-direction:row;justify-content:center;gap:3px}
 .prog li:has(br){font-size:9px}
 .prog li::before{width:14px;height:14px;border-width:2px}
 .prog li.done::before{font-size:10px;line-height:10px}
 body.q main{height:calc(100vh - 82px);height:calc(100dvh - 82px);gap:8px;padding-top:8px}
 .later{font-size:12px;line-height:1.4;padding:0 10px}
 body.q h1{font-size:21px}
 .opts{grid-template-columns:repeat(4,1fr);gap:6px}
 .opt{font-size:18px;min-height:52px;padding:0}
 .prog li br{display:none}
}
/* G の見学: 進み具合と「ミエるトレーニング、略して」の行の分（約 80px）を、絵の大きさの計算に入れる */
.wt + .wh5 ~ .wfig{width:min(100%,330px,calc((100vh - 410px) * 492 / 442));width:min(100%,330px,calc((100dvh - 410px) * 492 / 442))}
@media (max-height:640px){.wt + .wh5 ~ .wfig{width:min(100%,330px,calc((100vh - 380px) * 492 / 442));width:min(100%,330px,calc((100dvh - 380px) * 492 / 442))}}
</style>

// 008: main の最後の部品がボタンより下に隠れているときだけ、ボタンのすぐ上に影を出す（答えの画面と結果だけ）

function gabor(ctx,cx,cy,size,deg,contrast){
  const img=ctx.getImageData(cx-size/2,cy-size/2,size,size),d=img.data,t=deg*Math.PI/180,wl=size/4.6,sg=size/5.4;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const X=x-size/2+.5,Y=y-size/2+.5,xr=X*Math.cos(t)+Y*Math.sin(t);
    const env=Math.exp(-(X*X+Y*Y)/(2*sg*sg));const v=255-env*255*contrast*(0.5-0.5*Math.cos(2*Math.PI*xr/wl));
    const i=(y*size+x)*4;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
  ctx.putImageData(img,cx-size/2,cy-size/2)}

function canvas2(mark,reveal){const H=reveal?446:400,P=POS2.map(([px,py])=>[px,reveal&&py>200?py+27:py]);
  const c=document.createElement('canvas');c.width=520;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,520,H);
  const ring=(cx,cy,col,w,dash)=>{x.save();x.strokeStyle=col;x.lineWidth=w;x.setLineDash(dash);x.beginPath();x.arc(cx,cy,82,0,7);x.stroke();x.restore()};
  // 順番：模様 → 丸 → 番号の札 → 「あなた」（模様は四角ごと塗るので先に描く）
  [1,.35,.12,.045,.02].forEach((k,i)=>{const [cx,cy]=P[i];gabor(x,cx,cy,150,45,reveal&&i+1>mark?.6:k)});
  P.forEach(([cx,cy],i)=>{if(reveal&&i+1>mark)ring(cx,cy,'#f5a000',6,[14,10])});
  if(mark){const [cx,cy]=P[mark-1];ring(cx,cy,'#0f7a74',8,[])}
  P.forEach(([cx,cy],i)=>{x.fillStyle='#0f7a74';x.beginPath();x.arc(cx-58,cy-58,20,0,7);x.fill();x.fillStyle='#fff';x.font='800 24px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText(String(i+1),cx-58,cy-57)});
  if(mark){const [cx,cy]=P[mark-1],r=18,ty=cy+90;x.font='800 26px '+FONT;const w=Math.ceil(x.measureText('あなた').width)+30,l=cx-w/2;
    x.fillStyle='#0f7a74';x.beginPath();x.arc(l+r,ty+r,r,Math.PI/2,Math.PI*1.5);x.arc(l+w-r,ty+r,r,-Math.PI/2,Math.PI/2);x.closePath();x.fill();
    x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText('あなた',cx,ty+r+1)}
  c.setAttribute('role','img');c.setAttribute('aria-label',!reveal?'だんだんうすくなる、5つのしま模様':mark<5?'5つのしま模様。あなたが選んだ番号に緑の丸。見えていなかった番号の模様を濃くして、点線の丸':'5つのしま模様。あなたが選んだ番号に緑の丸');return c}
